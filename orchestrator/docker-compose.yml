version: "3.9"

services:
  api:
    image: python:3.12-slim
    working_dir: /app
    command: ["python", "-m", "http.server", "8080"]
    volumes:
      - ./api:/app
    ports:
      - "8080:8080"

  worker:
    image: python:3.12-slim
    working_dir: /app
    command: ["sleep", "infinity"]
    volumes:
      - ./worker:/app

  scheduler:
    image: python:3.12-slim
    working_dir: /app
    command: ["sleep", "infinity"]
    volumes:
      - ./scheduler:/app

  ui:
    image: node:20-alpine
    working_dir: /app
    command: ["sh", "-c", "sleep infinity"]
    volumes:
      - ./ui:/app
